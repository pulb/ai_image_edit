#
# Builds deployments/docker/Dockerfile.qwen_image21 (the NiceGUI + qwen_image21 image
# meant for a RunPod GPU Pod) and pushes it to GHCR. This workflow only
# builds and pushes — it does not touch a running RunPod Pod. RunPod's
# API has no "swap this Pod's image" call, so redeploying means
# terminating and recreating the Pod on the new tag yourself, via the
# RunPod console or `runpodctl`, once you're ready to roll it out.
name: Build qwen_image21 Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "deployments/docker/Dockerfile.qwen_image21"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-qwen-image21

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path; github.repository preserves
      # the repo's own casing.
      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Newest commit of the separately licensed ai_image_edit_qwen package
      # (public repo, so no credentials needed). Passed to the Dockerfile as
      # QWEN_LIB_REF: each build uses that exact commit, and the cached pip
      # layer is rebuilt whenever the package changed.
      - name: Resolve ai_image_edit_qwen commit
        id: qwen_lib
        run: |
          sha=$(git ls-remote https://github.com/pulb/ai_image_edit_qwen HEAD | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.qwen_image21
          push: true
          build-args: |
            QWEN_LIB_REF=${{ steps.qwen_lib.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
