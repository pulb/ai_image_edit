#
# Builds deployments/docker/Dockerfile (ComfyUI, PyTorch and the app, without
# model weights, which the app downloads on first start) and pushes it to
# GHCR. The app is installed from this commit.
name: Build Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "deployments/docker/Dockerfile"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # PyTorch with its CUDA libraries needs more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path.
      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      # Only the Dockerfile is needed from the checkout: the app comes from
      # GitHub at this commit, so the context is empty.
      - uses: docker/build-push-action@v6
        with:
          context: deployments/docker
          file: deployments/docker/Dockerfile
          push: true
          build-args: |
            APP_REPO=${{ github.repository }}
            APP_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
