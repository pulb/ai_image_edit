#
# Builds deployments/docker/Dockerfile.qwen_image_edit_2511_aio (ComfyUI +
# Qwen-Image-Edit 2511 AIO checkpoint and LoRAs) and pushes it to GHCR. The
# checkpoint and LoRAs are baked into the image, so this runs only on manual
# dispatch, not on pushes or tags.
name: Build qwen_image_edit_2511_aio Docker image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-qwen-image-edit-2511-aio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The weights plus PyTorch need far more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path.
      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest
            type=sha

      # No layer cache: the huge weight layers would exceed the Actions cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.qwen_image_edit_2511_aio
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
