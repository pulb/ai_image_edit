[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-edit"
version = "0.1.0"
description = "Model-agnostic web app for AI-assisted image editing and generation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Backends (MODEL_BACKEND)
qwen_image_backend = [
    # Separately licensed (Qwen RESEARCH LICENSE AGREEMENT); brings diffusers,
    # transformers, accelerate, torchvision and `spaces`. torch is assumed to
    # be installed already.
    "ai-image-edit-qwen @ git+https://github.com/pulb/ai_image_edit_qwen",
]
comfy_backend = [
    "requests",
    "websocket-client",
    "sentencepiece",
    "transformers",
]
# Frontends (FRONTEND)
nicegui_frontend = ["nicegui==3.18.0"]
gradio_frontend = ["gradio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_image_edit.models.qwen_image_edit_2511_aio" = ["workflow_api.json"]
"ai_image_edit.models.qwen_image21_gguf" = ["workflow_api.json"]
