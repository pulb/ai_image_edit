[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-edit"
version = "0.1.0"
description = "Model-agnostic web app for AI-assisted image editing and generation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# Backends (MODEL_WORKFLOW)
comfy_backend = [
    "requests",
    "websocket-client",
    "sentencepiece",
    "transformers",
]
# Tests (see AGENTS.md)
test = ["jsonschema"]
# Frontends (FRONTEND)
nicegui_frontend = ["nicegui==3.18.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The workflow files and their JSON Schema are installed with the app.
"ai_image_edit" = ["data/*.json", "data/workflows/*.json"]

