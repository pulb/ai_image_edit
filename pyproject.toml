[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-edit"
dynamic = ["version"]
description = "Model-agnostic app for AI-assisted image editing and generation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pillow",
    "nicegui==3.18.0",
    "requests",
    "jsonschema",
    "websocket-client",
]

[project.scripts]
ai-image-edit = "ai_image_edit.app:main"

[tool.setuptools_scm]
# The version comes from the git tags: v0.2.0 gives 0.2.0, and commits after it
# 0.2.1.devN+g<hash>. A source archive from GitHub has no .git folder; there
# .git_archival.txt carries the same information. Without either, as in a plain
# copy of the folder, the fallback applies.
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The workflow files, their JSON Schema and the UI's stylesheet and script are installed with the app.
"ai_image_edit" = ["data/*.json", "data/workflows/*.json", "ui/static/*"]

