[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-image-edit"
version = "0.1.0"
description = "Model-agnostic web app for AI-assisted image editing and generation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "pillow",
    "nicegui==3.18.0",
    "requests",
    "jsonschema",
    "websocket-client",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The workflow files, their JSON Schema and the UI's stylesheet and script are installed with the app.
"ai_image_edit" = ["data/*.json", "data/workflows/*.json", "ui/static/*"]

